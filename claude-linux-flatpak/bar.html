<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 3px; overflow: hidden; background: transparent; }
#b {
  position: absolute;
  top: 0; left: 0;
  height: 3px;
  width: 0%;
  opacity: 0;
  background: linear-gradient(90deg, #4f9eff, #a78bfa);
  border-radius: 0 2px 2px 0;
  box-shadow: 0 0 10px rgba(79, 158, 255, 0.6);
}
</style>
</head>
<body>
<div id="b"></div>
<script>
const b = document.getElementById('b');
let _t = null, _p = 0, _done = false, _t0 = 0;
const MIN = 500;

function start() {
  _done = false; _t0 = Date.now(); _p = 15;
  clearInterval(_t); _t = null;
  b.style.transition = 'none';
  b.style.opacity = '1';
  b.style.width = '0%';
  requestAnimationFrame(() => {
    b.style.transition = 'width 0.4s ease';
    b.style.width = '15%';
    _t = setInterval(() => {
      if (_done) { clearInterval(_t); _t = null; return; }
      if (_p < 85) { _p = Math.min(_p + Math.random() * 4 + 1, 85); b.style.width = _p + '%'; }
    }, 400);
  });
}

function finish() {
  if (_done) return; _done = true;
  clearInterval(_t); _t = null;
  const wait = Math.max(0, MIN - (Date.now() - _t0));
  setTimeout(() => {
    b.style.transition = 'width 0.25s ease';
    b.style.width = '100%';
    setTimeout(() => {
      b.style.transition = 'opacity 0.4s ease';
      b.style.opacity = '0';
      setTimeout(() => { b.style.width = '0%'; }, 400);
    }, 250);
  }, wait);
}

start();
</script>
</body>
</html>
